<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glasscraft</title>
    <script>
      // Apply the remembered theme before first paint so the window never flashes the wrong one.
      try {
        var t = localStorage.getItem("glasscraft.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("glasscraft.reduceEffects") === "1") document.documentElement.dataset.effects = "reduced";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
