[package]
name = "glasscraft"
version = "0.1.0"
description = "Glasscraft - a Liquid Glass Minecraft server manager for Windows"
authors = ["Glasscraft"]
edition = "2021"
default-run = "glasscraft"

[lib]
name = "glasscraft_lib"

# `fake_mc` plays a Minecraft server in tests. It is built by `cargo test` (default
# features) but not by `tauri build`/`tauri dev`, which pass --no-default-features,
# so it never ships in the installer.
[[bin]]
name = "fake_mc"
path = "src/bin/fake_mc.rs"
required-features = ["test-helpers"]

[features]
default = ["test-helpers"]
test-helpers = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.2", features = ["full"] }
futures-util = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
zip = "8.6.0"
chrono = "0.4.45"
rand = "0.10.3"
regex = "1.13.1"
anyhow = "1.0.104"
sysinfo = "0.39.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_Security"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "http2", "query", "charset"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
